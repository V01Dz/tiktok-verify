<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conectando ao Sistema Local…</title>
</head>
<body style="font-family:sans-serif;background:#0a110d;color:#e4ece6;text-align:center;padding:60px">
<h2 id="msg">Conectando ao Sistema Local…</h2>
<p id="sub" style="color:#89968d">Não feche esta aba.</p>
<script>
  var params = window.location.search;
  if (params.indexOf('code=') === -1) {
    document.getElementById('msg').textContent = 'Não recebi um código de autorização.';
    document.getElementById('sub').textContent = 'Volte ao programa e tente conectar de novo.';
  } else {
    window.location.replace('http://127.0.0.1:8765/settings/tiktok/callback' + params);
  }
</script>
</body>
</html>
